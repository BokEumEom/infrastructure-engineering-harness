schema_version: "1.0"
services:
  - id: public-api
    owner: platform-team
    criticality: high
    runtime:
      category: compute
      deployment_model: managed
    dependencies:
      - id: primary-datastore
        type: datastore
        criticality: critical
      - id: event-bus
        type: messaging
        criticality: high
      - id: identity-service
        type: identity
        criticality: high
    telemetry:
      metrics: true
      logs: true
      traces: true
    objectives:
      availability_percent: 99.9
      latency_p95_ms: 500

  - id: async-worker
    owner: platform-team
    criticality: medium
    runtime:
      category: compute
    dependencies:
      - id: event-bus
        type: messaging
        criticality: high
    telemetry:
      metrics: true
      logs: true
      traces: false
