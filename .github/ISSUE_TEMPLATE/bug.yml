name: Bug report
description: Report a reproducible contract, validator, runtime or documentation bug
title: "[Bug] "
body:
  - type: input
    id: revision
    attributes:
      label: Harness revision
      placeholder: commit SHA or branch
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands or fixture needed to reproduce the problem.
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This is not an undisclosed security vulnerability; security-sensitive reports follow SECURITY.md.
          required: true
